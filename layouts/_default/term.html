{{- /*
  term.html · v3 editorial 单个 taxonomy 词条页（/categories/项目实战/ 等）
  渲染该词条下的文章列表
*/ -}}
{{ define "main" }}
<div class="article-wrap">
  <header class="article-header">
    <div class="eyebrow">
      <span class="eyebrow-meta">{{ .Type }}</span>
    </div>
    <h1 class="article-title">{{ .Title }}</h1>
    <p class="article-deck">共 {{ len .Pages }} 篇</p>
  </header>

  <section class="list-body">
    <div class="profile-recent-list">
      {{- range .Pages.ByDate.Reverse -}}
        {{- partial "list-item.html" . -}}
      {{- end -}}
    </div>
  </section>
</div>
{{ end }}
